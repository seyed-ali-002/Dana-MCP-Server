name: Hotfix stuck UI and logos
on:
  workflow_dispatch:
  push:
    paths:
      - packaging/hotfix_stuck_ui_and_logos.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python3 packaging/hotfix_stuck_ui_and_logos.py
      - name: Commit
        run: |
          git config user.name "dana-bot"
          git config user.email "dana-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(ui,setup): unstick control API, cache public probe, regenerate logos v2.0.4"
            git push
          fi
