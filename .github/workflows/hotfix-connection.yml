name: Hotfix connection retries
on:
  workflow_dispatch:
  push:
    paths:
      - "packaging/hotfix_connection_retries.py"
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Apply connection retries
        run: python3 packaging/hotfix_connection_retries.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dana/setup.py
          git commit -m "fix(1.7.2): retry flaky public MCP probes and connection tests"
          git push
