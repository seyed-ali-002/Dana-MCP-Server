name: Apply SuperMCP backend
on:
  workflow_dispatch:
  push:
    paths:
      - "packaging/hotfix_supermcp_only.py"
      - "packaging/hotfix_optimization_only.py"
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: python3 packaging/hotfix_supermcp_only.py
      - run: python3 packaging/hotfix_optimization_only.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dana/supermcp.py dana/tools/optimization.py
          git commit -m "feat(1.7.3): SuperMCP full tool manifest + progressive tools default off"
          git push
