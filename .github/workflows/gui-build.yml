name: Dana Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            shell: bash
            build_script: ./packaging/build_linux.sh
          - platform: windows-latest
            shell: pwsh
            build_script: ./packaging/build_windows.ps1
          - platform: macos-latest
            shell: bash
            build_script: ./packaging/build_macos.sh
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build Dana Desktop (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: ./packaging/build_linux.sh
      - name: Build Dana Desktop (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Build Dana Desktop (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dana-${{ matrix.platform }}
          path: ui/src-tauri/target/release/bundle/**
