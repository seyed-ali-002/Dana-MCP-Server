name: Dana Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: ["main"]

concurrency:
  group: dana-desktop-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine next SemVer release
        id: next
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force origin

          # Base version from pyproject.toml (MAJOR.MINOR kept; PATCH advances per successful release).
          base="$(grep -E '^version = ' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in pyproject.toml: ${base}" >&2
            exit 1
          fi
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"

          latest_patch="$(git tag --list "v${major}.${minor}.*" | sed -nE "s/^v${major}\\.${minor}\\.([0-9]+)$/\1/p" | sort -n | tail -1 || true)"
          if [[ -z "${latest_patch}" ]]; then
            # First release for this minor: use pyproject patch as-is if tag missing, else start at that value.
            next_patch="${base##*.}"
            # If that exact tag already exists (re-run), increment.
            if git rev-parse "v${major}.${minor}.${next_patch}" >/dev/null 2>&1; then
              next_patch=$((next_patch + 1))
            fi
          else
            next_patch=$((latest_patch + 1))
          fi

          version="${major}.${minor}.${next_patch}"
          tag="v${version}"
          echo "Base from pyproject: ${base}"
          echo "Next release version: ${version}"
          echo "Next release tag: ${tag}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*

      - uses: dtolnay/rust-toolchain@stable

      - name: Apply release version to project metadata
        shell: bash
        run: |
          set -euo pipefail
          bash ./packaging/set_version.sh "${{ needs.version.outputs.version }}"

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Build Dana Desktop (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: bash ./packaging/build_linux.sh

      - name: Build Dana Desktop (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Build Dana Desktop (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash ./packaging/build_macos.sh

      - name: Prepare Linux release assets
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          shopt -s nullglob
          files=(
            ui/src-tauri/target/release/bundle/deb/*.deb
            ui/src-tauri/target/release/bundle/appimage/*.AppImage
          )
          for file in "${files[@]}"; do
            cp "$file" "dist/release-assets/Dana-Linux-$(basename "$file")"
          done
          test -n "$(find dist/release-assets -type f -print -quit)"

      - name: Prepare Windows release assets
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist/release-assets" | Out-Null
          $files = Get-ChildItem "ui/src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" }
          foreach ($file in $files) {
            Copy-Item $file.FullName "dist/release-assets/Dana-Windows-$([System.IO.Path]::GetFileName($file.FullName))"
          }
          if (-not (Get-ChildItem "dist/release-assets" -File)) {
            throw "No Windows installer assets were produced."
          }

      - name: Prepare macOS release assets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          shopt -s nullglob
          files=(
            ui/src-tauri/target/release/bundle/dmg/*.dmg
            ui/src-tauri/target/release/bundle/macos/*.app.tar.gz
          )
          for file in "${files[@]}"; do
            cp "$file" "dist/release-assets/Dana-macOS-$(basename "$file")"
          done
          test -n "$(find dist/release-assets -type f -print -quit)"

      - name: Upload distributable release assets
        uses: actions/upload-artifact@v7
        with:
          name: Dana-${{ matrix.platform }}
          path: dist/release-assets/*
          if-no-files-found: error

  release:
    if: needs.build.result == 'success'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for release metadata
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: Dana-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Apply version and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -maxdepth 1 -type f -print)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found." >&2
            exit 1
          fi

          bash ./packaging/set_version.sh "${RELEASE_VERSION}"

          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -Fxv "${RELEASE_TAG}" | sort -V | tail -1 || true)"
          notes_file="$(mktemp)"
          {
            echo "## Highlights"
            echo
            if [[ -n "$previous_tag" ]]; then
              git log --format='- %s' "${previous_tag}..${TARGET_SHA}" | head -80
            else
              git log --format='- %s' "${TARGET_SHA}" -n 80
            fi
            echo
            echo "## Release contents"
            echo
            echo "- Linux: Debian package and AppImage"
            echo "- Windows: MSI and executable"
            echo "- macOS: DMG and app archive"
            echo
            echo "## Notes"
            echo
            echo "- Desktop packages are built automatically on every successful push to main."
            echo "- Version numbers follow Semantic Versioning (vX.Y.Z)."
            if [[ -n "$previous_tag" ]]; then
              echo
              echo "**Full Changelog**: https://github.com/${REPOSITORY}/compare/${previous_tag}...${RELEASE_TAG}"
            fi
          } > "$notes_file"

          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists; uploading rebuilt assets."
            gh release upload "${RELEASE_TAG}" "${files[@]}" --repo "${REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --repo "${REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "Dana ${RELEASE_TAG}" \
              --notes-file "$notes_file"
          fi

          # Keep repository version metadata aligned with the published release.
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pyproject.toml dana/__init__.py ui/package.json ui/src-tauri/tauri.conf.json ui/src-tauri/Cargo.toml || true
            if ! git diff --cached --quiet; then
              git commit -m "chore: release ${RELEASE_TAG} [skip ci]"
              git push origin HEAD:main || true
            fi
          fi

          # Ensure the annotated SemVer tag points at this release commit when possible.
          if ! git rev-parse "${RELEASE_TAG}" >/dev/null 2>&1; then
            git tag -a "${RELEASE_TAG}" -m "Dana ${RELEASE_TAG}" "${TARGET_SHA}" || true
            git push origin "${RELEASE_TAG}" || true
          fi

          rm -f "$notes_file"
