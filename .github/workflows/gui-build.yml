name: Dana Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            shell: bash
            build_script: ./packaging/build_linux.sh
          - platform: windows-latest
            shell: pwsh
            build_script: ./packaging/build_windows.ps1
          - platform: macos-latest
            shell: bash
            build_script: ./packaging/build_macos.sh
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build Dana Desktop (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: bash ./packaging/build_linux.sh
      - name: Build Dana Desktop (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Build Dana Desktop (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dana-${{ matrix.platform }}
          path: ui/src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Dana-*
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find release -type f -print
          test -n "$(find release -type f -print -quit)"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f)
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "Dana ${GITHUB_REF_NAME}" \
            --generate-notes
