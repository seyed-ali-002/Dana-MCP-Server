name: Dana Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            shell: bash
            build_script: ./packaging/build_linux.sh
          - platform: windows-latest
            shell: pwsh
            build_script: ./packaging/build_windows.ps1
          - platform: macos-latest
            shell: bash
            build_script: ./packaging/build_macos.sh
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build Dana Desktop (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: bash ./packaging/build_linux.sh
      - name: Build Dana Desktop (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./packaging/build_windows.ps1
      - name: Build Dana Desktop (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash ./packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Dana-${{ matrix.platform }}
          path: ui/src-tauri/target/release/bundle/**
          if-no-files-found: error

  release:
    # Publish automatically for main pushes after all desktop builds pass.
    # Version tags are also supported and use the tag as the release name.
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository for GitHub CLI release operations
        uses: actions/checkout@v5

      - name: Download desktop bundles
        uses: actions/download-artifact@v4
        with:
          pattern: Dana-*
          path: release
          merge-multiple: true

      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          find release -type f -print
          test -n "$(find release -type f -print -quit)"

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -type f)
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}" \
              --title "Dana ${RELEASE_TAG}" \
              --generate-notes
          fi
