name: Dana Desktop Releases

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Build Dana Desktop (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: bash ./packaging/build_linux.sh

      - name: Build Dana Desktop (Windows)
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Build Dana Desktop (macOS)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: bash ./packaging/build_macos.sh

      # Only publish actual distributable installers/packages. Do not upload the
      # entire Tauri bundle tree because it contains duplicate internal files
      # such as ui.png/AppRun and those cannot coexist as GitHub Release assets.
      - name: Prepare Linux release assets
        if: startsWith(matrix.platform, 'ubuntu')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          shopt -s nullglob
          files=(
            ui/src-tauri/target/release/bundle/deb/*.deb
            ui/src-tauri/target/release/bundle/appimage/*.AppImage
          )
          for file in "${files[@]}"; do
            cp "$file" "dist/release-assets/Dana-Linux-$(basename "$file")"
          done
          test -n "$(find dist/release-assets -type f -print -quit)"

      - name: Prepare Windows release assets
        if: startsWith(matrix.platform, 'windows')
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "dist/release-assets" | Out-Null
          $files = Get-ChildItem "ui/src-tauri/target/release/bundle" -Recurse -File |
            Where-Object { $_.Extension -in ".msi", ".exe" }
          foreach ($file in $files) {
            Copy-Item $file.FullName "dist/release-assets/Dana-Windows-$([System.IO.Path]::GetFileName($file.FullName))"
          }
          if (-not (Get-ChildItem "dist/release-assets" -File)) {
            throw "No Windows installer assets were produced."
          }

      - name: Prepare macOS release assets
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/release-assets
          shopt -s nullglob
          files=(
            ui/src-tauri/target/release/bundle/dmg/*.dmg
            ui/src-tauri/target/release/bundle/macos/*.app.tar.gz
          )
          for file in "${files[@]}"; do
            cp "$file" "dist/release-assets/Dana-macOS-$(basename "$file")"
          done
          test -n "$(find dist/release-assets -type f -print -quit)"

      - name: Upload distributable release assets
        uses: actions/upload-artifact@v7
        with:
          name: Dana-${{ matrix.platform }}
          path: dist/release-assets/*
          if-no-files-found: error

  release:
    if: needs.build.result == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop release assets
        uses: actions/download-artifact@v8
        with:
          pattern: Dana-*
          path: release
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          find release -maxdepth 1 -type f -print
          test -n "$(find release -maxdepth 1 -type f -print -quit)"

      - name: Determine release tag
        id: release_tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v0.1.0-build.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release_tag.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find release -maxdepth 1 -type f -print)
          if (( ${#files[@]} == 0 )); then
            echo "No release assets found." >&2
            exit 1
          fi

          if gh release view "${RELEASE_TAG}" --repo "${REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${files[@]}"               --repo "${REPOSITORY}"               --clobber
          else
            gh release create "${RELEASE_TAG}" "${files[@]}"               --repo "${REPOSITORY}"               --target "${TARGET_SHA}"               --title "Dana ${RELEASE_TAG}"               --generate-notes
          fi
