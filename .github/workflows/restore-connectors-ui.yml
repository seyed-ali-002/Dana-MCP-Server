name: Restore Connectors UI
on:
  workflow_dispatch:
  push:
    paths:
      - packaging/restore_connectors_ui.py
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Restore App.css and App.tsx
        run: python3 packaging/restore_connectors_ui.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/src/App.css ui/src/App.tsx
          git diff --cached --quiet || git commit -m "chore(ui): restore App.css/App.tsx Connectors wire-up"
          git push
