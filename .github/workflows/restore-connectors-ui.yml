name: Restore Connectors UI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/restore-connectors-ui.yml"

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore App.css from last good commit
        run: |
          git show 1bd82f70a72fb64c7d800b1f462191bfbbe4eb45:ui/src/App.css > ui/src/App.css
          if ! grep -q 'connectors.css' ui/src/App.css; then
            printf '\n@import "./connectors.css";\n' >> ui/src/App.css
          fi
          wc -c ui/src/App.css

      - name: Wire ConnectorsPage into App.tsx
        run: python3 packaging/wire_connectors_ui.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ui/src/App.css ui/src/App.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(ui): restore App.css + wire ConnectorsPage"
            git push
          fi
