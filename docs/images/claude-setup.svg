<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#17120e"/><text x="60" y="70" fill="#fff" font-size="34" font-family="Arial" font-weight="700">Claude + Dana — visual setup</text><text x="60" y="108" fill="#cfc0b2" font-size="18" font-family="Arial">No Developer Mode step is required for a custom remote MCP connector.</text><g font-family="Arial"><rect x="60" y="155" width="330" height="230" rx="22" fill="#292017" stroke="#d8a36b" stroke-width="3"/><text x="88" y="195" fill="#e6b57d" font-size="22" font-weight="700">1</text><text x="88" y="235" fill="#fff" font-size="22" font-weight="700">Customize → Connectors</text><text x="88" y="275" fill="#e7ddd4" font-size="18">Open the Connectors page</text><text x="88" y="310" fill="#e7ddd4" font-size="18">Click + / Add custom connector</text><path d="M390 270 H450" stroke="#e6b57d" stroke-width="5"/><path d="M438 258 l20 12 -20 12" fill="#e6b57d"/><rect x="450" y="155" width="330" height="230" rx="22" fill="#292017" stroke="#d8a36b" stroke-width="3"/><text x="478" y="195" fill="#e6b57d" font-size="22" font-weight="700">2</text><text x="478" y="235" fill="#fff" font-size="22" font-weight="700">Enter Dana URL</text><text x="478" y="275" fill="#e7ddd4" font-size="18">Name: Dana</text><text x="478" y="310" fill="#e7ddd4" font-size="18">URL: Dana …/mcp</text><path d="M780 270 H840" stroke="#e6b57d" stroke-width="5"/><path d="M828 258 l20 12 -20 12" fill="#e6b57d"/><rect x="840" y="155" width="300" height="230" rx="22" fill="#292017" stroke="#d8a36b" stroke-width="3"/><text x="868" y="195" fill="#e6b57d" font-size="22" font-weight="700">3</text><text x="868" y="235" fill="#fff" font-size="22" font-weight="700">Add → Connect</text><text x="868" y="275" fill="#e7ddd4" font-size="18">Authorize if requested</text><text x="868" y="310" fill="#e7ddd4" font-size="18">Enable for the chat</text><rect x="60" y="435" width="1080" height="180" rx="22" fill="#211a15" stroke="#4a392c"/><text x="90" y="480" fill="#fff" font-size="22" font-weight="700">4 — Verify</text><text x="90" y="520" fill="#e7ddd4" font-size="18">Use + → Connectors in a conversation and make sure Dana is enabled.</text><text x="90" y="560" fill="#e6b57d" font-size="17">Claude connects to remote MCP from Anthropic's cloud, so Dana must be publicly reachable.</text><text x="90" y="590" fill="#9d8e81" font-size="15">UI labels may change; use the current Claude Connectors screen.</text></g></svg>