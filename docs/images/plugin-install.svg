<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" rx="28" fill="#0d1524"/><text x="60" y="70" fill="#fff" font-size="34" font-family="Arial" font-weight="700">Dana plugin / app — visual install flow</text><text x="60" y="108" fill="#9fb0c8" font-size="18" font-family="Arial">Some ChatGPT accounts show “Install plugin”; newer interfaces may use Apps / custom MCP apps.</text><g font-family="Arial"><rect x="70" y="165" width="240" height="190" rx="20" fill="#18253a" stroke="#6ea8ff" stroke-width="3"/><text x="100" y="205" fill="#6ea8ff" font-size="22" font-weight="700">1</text><text x="100" y="245" fill="#fff" font-size="21" font-weight="700">Apps / Plugins</text><text x="100" y="285" fill="#d7e1ef" font-size="17">Open the app/plugin area</text><path d="M310 260 H360" stroke="#6ea8ff" stroke-width="5"/><path d="M348 248 l20 12 -20 12" fill="#6ea8ff"/><rect x="360" y="165" width="240" height="190" rx="20" fill="#18253a" stroke="#6ea8ff" stroke-width="3"/><text x="390" y="205" fill="#6ea8ff" font-size="22" font-weight="700">2</text><text x="390" y="245" fill="#fff" font-size="21" font-weight="700">Install plugin</text><text x="390" y="285" fill="#d7e1ef" font-size="17">If this option appears</text><path d="M600 260 H650" stroke="#6ea8ff" stroke-width="5"/><path d="M638 248 l20 12 -20 12" fill="#6ea8ff"/><rect x="650" y="165" width="240" height="190" rx="20" fill="#18253a" stroke="#6ea8ff" stroke-width="3"/><text x="680" y="205" fill="#6ea8ff" font-size="22" font-weight="700">3</text><text x="680" y="245" fill="#fff" font-size="21" font-weight="700">Connect</text><text x="680" y="285" fill="#d7e1ef" font-size="17">Authorize and review access</text><path d="M890 260 H940" stroke="#6ea8ff" stroke-width="5"/><path d="M928 248 l20 12 -20 12" fill="#6ea8ff"/><rect x="940" y="165" width="190" height="190" rx="20" fill="#18253a" stroke="#6ea8ff" stroke-width="3"/><text x="970" y="205" fill="#6ea8ff" font-size="22" font-weight="700">4</text><text x="970" y="245" fill="#fff" font-size="21" font-weight="700">Enable</text><text x="970" y="285" fill="#d7e1ef" font-size="17">Use in chat</text><rect x="70" y="415" width="1060" height="120" rx="20" fill="#111c2e" stroke="#2c3c56"/><text x="100" y="458" fill="#fff" font-size="19" font-weight="700">Important</text><text x="100" y="495" fill="#d7e1ef" font-size="17">For a custom Dana MCP app, follow the current client-specific setup below; menu names and availability vary by plan/account.</text></g></svg>