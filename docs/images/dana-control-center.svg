  <rect x="248" y="90" width="1000" height="150" rx="14" fill="#111827" stroke="#1e293b"/>
  <text x="272" y="122" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="11" font-weight="600">ONE-CLICK DEPLOYMENT</text>
  <text x="272" y="150" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="18" font-weight="600">Bring Dana online without the terminal.</text>
  <text x="272" y="174" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="14">Python runtime, Tailscale, Funnel and the public MCP endpoint.</text>
  <rect x="272" y="192" width="130" height="32" rx="10" fill="url(#accent)"/>
  <text x="292" y="213" fill="#eff6ff" font-family="Segoe UI, Arial" font-size="13" font-weight="600">Dana is active</text>
