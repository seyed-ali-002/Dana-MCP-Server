  <text x="608" y="290" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">02</text>
  <text x="640" y="290" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Dana Runtime</text>
  <rect x="840" y="276" width="50" height="18" rx="9" fill="#1e3a5f"/>
  <text x="848" y="289" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="10" font-weight="700">READY</text>
  <text x="608" y="318" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="14">Start the local MCP service.</text>
  <text x="608" y="348" fill="#64748b" font-family="Consolas, monospace" font-size="12">127.0.0.1:8765</text>
  <text x="948" y="290" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">03</text>
  <text x="980" y="290" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="15" font-weight="600">Funnel</text>
  <rect x="1180" y="276" width="50" height="18" rx="9" fill="#1e3a5f"/>
  <text x="1188" y="289" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="10" font-weight="700">READY</text>
  <text x="948" y="318" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="14">Publish the HTTPS MCP endpoint.</text>
  <text x="948" y="348" fill="#64748b" font-family="Consolas, monospace" font-size="12">*.ts.net</text>
  <!-- progress -->
  <rect x="248" y="410" width="1000" height="120" rx="14" fill="#111827" stroke="#1e293b"/>
  <text x="272" y="440" fill="#64748b" font-family="Segoe UI, Arial" font-size="11">SETUP PROGRESS</text>
  <text x="272" y="462" fill="#e5e7eb" font-family="Segoe UI, Arial" font-size="16" font-weight="600">100%</text>
  <text x="1100" y="450" fill="#94a3b8" font-family="Segoe UI, Arial" font-size="13">Ready when you are.</text>
  <rect x="272" y="480" width="952" height="8" rx="4" fill="#243049"/>
  <rect x="272" y="480" width="952" height="8" rx="4" fill="url(#accent)"/>
  <rect x="272" y="502" width="72" height="22" rx="11" fill="#1e3a5f"/>
  <text x="282" y="517" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="11">Tailscale</text>
  <rect x="354" y="502" width="100" height="22" rx="11" fill="#1e3a5f"/>
  <text x="364" y="517" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="11">Authentication</text>
  <rect x="464" y="502" width="52" height="22" rx="11" fill="#1e3a5f"/>
  <text x="478" y="517" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="11">Dana</text>
  <rect x="526" y="502" width="58" height="22" rx="11" fill="#1e3a5f"/>
  <text x="538" y="517" fill="#3b82f6" font-family="Segoe UI, Arial" font-size="11">Funnel</text>
</svg>