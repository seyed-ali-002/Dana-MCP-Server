<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" rx="28" fill="#0b1220"/><text x="60" y="70" fill="#fff" font-size="34" font-family="Arial" font-weight="700">ChatGPT + Dana — visual setup</text><text x="60" y="108" fill="#9fb0c8" font-size="18" font-family="Arial">Developer Mode is required for custom MCP apps/connectors.</text><g font-family="Arial"><rect x="60" y="150" width="330" height="220" rx="22" fill="#16243a" stroke="#4f8cff" stroke-width="3"/><text x="88" y="190" fill="#6ea8ff" font-size="22" font-weight="700">1</text><text x="88" y="230" fill="#fff" font-size="22" font-weight="700">Settings</text><text x="88" y="270" fill="#d7e1ef" font-size="18">Apps / Advanced Settings</text><text x="88" y="305" fill="#d7e1ef" font-size="18">Enable Developer Mode</text><path d="M390 260 H450" stroke="#6ea8ff" stroke-width="5"/><path d="M438 248 l20 12 -20 12" fill="#6ea8ff"/><rect x="450" y="150" width="330" height="220" rx="22" fill="#16243a" stroke="#4f8cff" stroke-width="3"/><text x="478" y="190" fill="#6ea8ff" font-size="22" font-weight="700">2</text><text x="478" y="230" fill="#fff" font-size="22" font-weight="700">Create custom app</text><text x="478" y="270" fill="#d7e1ef" font-size="18">Apps → Create</text><text x="478" y="305" fill="#d7e1ef" font-size="18">Enter Dana MCP endpoint</text><path d="M780 260 H840" stroke="#6ea8ff" stroke-width="5"/><path d="M828 248 l20 12 -20 12" fill="#6ea8ff"/><rect x="840" y="150" width="300" height="220" rx="22" fill="#16243a" stroke="#4f8cff" stroke-width="3"/><text x="868" y="190" fill="#6ea8ff" font-size="22" font-weight="700">3</text><text x="868" y="230" fill="#fff" font-size="22" font-weight="700">Scan + Create</text><text x="868" y="270" fill="#d7e1ef" font-size="18">Scan Tools</text><text x="868" y="305" fill="#d7e1ef" font-size="18">Authorize if asked</text><rect x="60" y="420" width="1080" height="250" rx="22" fill="#101b2c" stroke="#2b3b55"/><text x="90" y="465" fill="#fff" font-size="22" font-weight="700">4 — Use Dana in a chat</text><text x="90" y="510" fill="#d7e1ef" font-size="18">Select the Dana app/connector for the message, then ask ChatGPT to use its tools.</text><text x="90" y="555" fill="#d7e1ef" font-size="18">For write/modify actions, ChatGPT may request confirmation depending on permissions.</text><text x="90" y="610" fill="#8fb8ff" font-size="17">Endpoint: use the exact URL printed by Dana (usually https://…ts.net/&lt;TOKEN&gt;/mcp)</text><text x="90" y="645" fill="#7f8da3" font-size="15">UI labels can change; follow the current ChatGPT Apps/Developer Mode screens.</text></g></svg>