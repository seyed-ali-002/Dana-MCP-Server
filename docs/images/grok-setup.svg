<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><rect width="1200" height="700" rx="28" fill="#0a0a0a"/><text x="60" y="70" fill="#fff" font-size="34" font-family="Arial" font-weight="700">Grok + Dana — visual setup</text><text x="60" y="108" fill="#aeb4bd" font-size="18" font-family="Arial">No ChatGPT-style Developer Mode step is required.</text><g font-family="Arial"><rect x="60" y="155" width="330" height="230" rx="22" fill="#171717" stroke="#8b96a5" stroke-width="3"/><text x="88" y="195" fill="#d2d7de" font-size="22" font-weight="700">1</text><text x="88" y="235" fill="#fff" font-size="22" font-weight="700">grok.com/connectors</text><text x="88" y="275" fill="#d5d9df" font-size="18">Open Connectors</text><text x="88" y="310" fill="#d5d9df" font-size="18">Click New Connector</text><path d="M390 270 H450" stroke="#d2d7de" stroke-width="5"/><path d="M438 258 l20 12 -20 12" fill="#d2d7de"/><rect x="450" y="155" width="330" height="230" rx="22" fill="#171717" stroke="#8b96a5" stroke-width="3"/><text x="478" y="195" fill="#d2d7de" font-size="22" font-weight="700">2</text><text x="478" y="235" fill="#fff" font-size="22" font-weight="700">Custom connector</text><text x="478" y="275" fill="#d5d9df" font-size="18">Select Custom</text><text x="478" y="310" fill="#d5d9df" font-size="18">Paste Dana MCP URL</text><path d="M780 270 H840" stroke="#d2d7de" stroke-width="5"/><path d="M828 258 l20 12 -20 12" fill="#d2d7de"/><rect x="840" y="155" width="300" height="230" rx="22" fill="#171717" stroke="#8b96a5" stroke-width="3"/><text x="868" y="195" fill="#d2d7de" font-size="22" font-weight="700">3</text><text x="868" y="235" fill="#fff" font-size="22" font-weight="700">Save + authorize</text><text x="868" y="275" fill="#d5d9df" font-size="18">Complete authentication</text><text x="868" y="310" fill="#d5d9df" font-size="18">Grok discovers Dana tools</text><rect x="60" y="435" width="1080" height="180" rx="22" fill="#111111" stroke="#34383e"/><text x="90" y="480" fill="#fff" font-size="22" font-weight="700">4 — Verify</text><text x="90" y="520" fill="#d5d9df" font-size="18">Keep Dana running and ensure its public HTTPS MCP URL is reachable.</text><text x="90" y="560" fill="#c3c9d1" font-size="17">Grok's current connector documentation uses Connectors → New Connector → Custom.</text><text x="90" y="590" fill="#8f969f" font-size="15">UI labels may change; use the current Grok Connectors screen.</text></g></svg>