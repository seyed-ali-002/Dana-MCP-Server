<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="danaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172033" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="danaBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="danaCyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Outer Squircle -->
  <rect x="12" y="12" width="232" height="232" rx="56" fill="url(#danaBg)" stroke="#334155" stroke-width="4" />
  <rect x="20" y="20" width="216" height="216" rx="48" fill="none" stroke="url(#danaBlue)" stroke-opacity="0.35" stroke-width="2" />
  <!-- Outer Orbit Ring -->
  <circle cx="128" cy="128" r="78" fill="none" stroke="url(#danaBlue)" stroke-width="10" stroke-linecap="round" stroke-dasharray="310 180" transform="rotate(-35 128 128)" filter="url(#glow)" />
  <!-- Inner Dynamic D / Node Core -->
  <path d="M92 76 H132 C164 76 186 98 186 128 C186 158 164 180 132 180 H92 Z" fill="none" stroke="url(#danaCyan)" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" />
  <!-- Central AI Core & MCP Satellites -->
  <circle cx="130" cy="128" r="20" fill="url(#danaBlue)" filter="url(#glow)" />
  <circle cx="130" cy="128" r="8" fill="#ffffff" />
  <circle cx="92" cy="76" r="9" fill="#38bdf8" />
  <circle cx="92" cy="180" r="9" fill="#10b981" />
  <circle cx="192" cy="84" r="10" fill="#60a5fa" />
</svg>
