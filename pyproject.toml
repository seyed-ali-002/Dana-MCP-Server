[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dana-mcp-server"
version = "1.8.0"
description = "Dana local MCP server with Tailscale Funnel and desktop control center"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Seyed Ali" }]
dependencies = [
  "mcp>=1.1.0",
  "httpx>=0.27",
  "pydantic>=2",
  "pydantic-settings>=2",
  "python-dotenv>=1",
  "uvicorn>=0.30",
  "starlette>=0.37",
  "anyio>=4",
  "Pillow>=10",
  "tiktoken>=0.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
dana = "dana.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dana*"]
