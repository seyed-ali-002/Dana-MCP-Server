[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dana-mcp-server"
version = "0.1.0"
description = "Cross-platform Python MCP server exposed through Tailscale Funnel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "pydantic-settings>=2.6,<3",
  "python-docx>=1.1,<2",
  "reportlab>=4,<5",
  "arabic-reshaper>=3,<4",
  "python-bidi>=0.4,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.27,<1",
]
browser = [
  "playwright>=1.45,<2",
]

[project.scripts]
dana-mcp = "dana.main:run"

[tool.setuptools.packages.find]
include = ["dana*"]

[tool.pytest.ini_options]
pythonpath = ["."]
