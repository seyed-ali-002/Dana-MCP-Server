[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dana-mcp-server"
version = "1.7.2"
description = "Cross-platform Python MCP server exposed through Tailscale Funnel."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "mcp>=1.9,<2",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "psutil>=5.9,<7",
  "Pillow>=10,<12",
  "mss>=9,<11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.6,<1",
]
gui = [
  "pywebview>=5,<6",
]

[project.scripts]
dana = "dana.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dana*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
